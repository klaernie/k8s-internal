apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s-mm
  namespace: magicmirror
spec:
  dnsNames:
    - s-mm.magicmirror.k8s.ak-online.be
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: s-mm-tls
  usages:
    - digital signature
    - key encipherment
