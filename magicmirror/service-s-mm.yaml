apiVersion: v1
kind: Service
metadata:
  labels:
    app: s-mm
  name: s-mm
  namespace: magicmirror
spec:
  externalTrafficPolicy: Cluster
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
  selector:
    app: s-mm
  sessionAffinity: None
  type: LoadBalancer
