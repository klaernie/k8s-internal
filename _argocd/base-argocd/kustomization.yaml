apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# this is a separate directory to safely apply the namespace transformer, which would
# rename one of the namespaces in ..
# causing a name collision (since they both would be named the same then)

resources:
  - github.com/argoproj/argo-cd//manifests/cluster-install?ref=v3.5.6

namespace: argocd
