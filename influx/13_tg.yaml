apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: influx
  name: telegraf
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 3
  serviceName: telegraf
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: telegraf
  minReadySeconds: 5
  template:
    metadata:
      labels:
        app: telegraf
    spec:
      containers:
        - image: telegraf:1.40.2
          name: telegraf
          env:
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegraf
                  key: INFLUX_TOKEN
          ports:
            - name: influxv1tcp
              containerPort: 8089
              protocol: TCP
            - name: influxv1udp
              containerPort: 8089
              protocol: UDP
            - name: collectd
              containerPort: 25826
              protocol: UDP
            - name: collectd-signed
              containerPort: 25827
              protocol: UDP
          volumeMounts:
            - name: telegraf-config-volume
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
              readOnly: true
            - name: telegraf-secret-volume
              mountPath: /etc/telegraf/collectd_auth
              subPath: collectd_auth
              readOnly: true
            - name: telegraf-config-volume
              mountPath: /etc/telegraf/collectd_stock_types.db
              subPath: collectd_stock_types.db
              readOnly: true
            - name: telegraf-config-volume
              mountPath: /etc/telegraf/collectd_additional_types.db
              subPath: collectd_additional_types.db
              readOnly: true
            - name: buffer
              mountPath: /var/lib/telegraf/buffer
      volumes:
        - name: telegraf-config-volume
          configMap:
            name: telegraf
        - name: telegraf-secret-volume
          secret:
            secretName: telegraf
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: buffer
      spec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: 2Gi
        storageClassName: zfs-quick
