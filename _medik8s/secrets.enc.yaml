# The PVE user referenced below needs the following privileges:
#   - VM.PowerMgmt  (to reboot/stop/start VMs)
#   - VM.Audit      (to query VM power status)
# Create in Proxmox:
#   pveum user add talos-fence-agent@pve
#   pveum aclmod /vms -user talos-fence-agent@pve -role PVEVMUser
# Or create a minimal custom role:
#   pveum roleadd FenceAgent -privs "VM.PowerMgmt VM.Audit"
#   pveum aclmod /vms -user talos-fence-agent@pve -role FenceAgent
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: secrets
  namespace: fence-agents-remediation
spec:
  secretTemplates:
    - name: fence-pve-credentials
      stringData:
        --username: "talos-fence-agent@pve"
        --password: "bac2f9db-f494-4128-985b-c0b47449c88f"
