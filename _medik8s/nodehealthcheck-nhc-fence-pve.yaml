apiVersion: remediation.medik8s.io/v1alpha1
kind: NodeHealthCheck
metadata:
  name: fence-pve
spec:
  minHealthy: 51%
  selector:
    matchExpressions:
      - key: kubernetes.io/os
        operator: In
        values:
          - linux
  unhealthyConditions:
    - type: Ready
      status: "False"
      duration: 300s
    - type: Ready
      status: Unknown
      duration: 300s
  remediationTemplate:
    apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
    kind: FenceAgentsRemediationTemplate
    name: fence-pve
    namespace: fence-agents-remediation
