apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
kind: FenceAgentsRemediationTemplate
metadata:
  name: fence-pve
  namespace: fence-agents-remediation
spec:
  template:
    spec:
      agent: fence_pve
      remediationStrategy: OutOfServiceTaint
      sharedSecretName: fence-pve-credentials
      retrycount: 3
      retryinterval: 5s
      timeout: 60s
      sharedparameters:
        "--ip": "pve.ak-online.be"
        "--action": "reboot"
      nodeparameters:
        --plug:
          talos-api01: "601"
          talos-api02: "602"
          talos-api03: "603"
          talos-w01: "611"
          talos-w02: "612"
          talos-w03: "613"
          talos-w04: "614"
          talos-w05: "615"
